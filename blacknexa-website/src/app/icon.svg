<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56">
  <!--
    Same shield mark used everywhere else in the app (see
    src/components/ui/logo.tsx). This static file is only the fallback
    shown before src/components/theme/favicon-sync.tsx's effect runs
    (or if JS is disabled) — it can't see this site's own theme toggle
    (data-theme attribute + localStorage; see theme-provider.tsx), so
    it's colored Warm Gold to match DEFAULT_THEME in src/lib/theme.ts
    rather than guessing from the OS color-scheme preference, which
    can disagree with the site's manually-selected theme.
  -->
  <path
    d="M24 2.6 44.2 9.4V28.2C44.2 41 35.4 50.2 24 53.8 12.6 50.2 3.8 41 3.8 28.2V9.4Z"
    fill="none"
    stroke="#c9a227"
    stroke-width="3.1"
    stroke-linejoin="round"
  />
  <path
    d="M24 12.6 35.4 16.5V28.4C35.4 36.2 30.2 41.8 24 44.4 17.8 41.8 12.6 36.2 12.6 28.4V16.5Z"
    fill="#c9a227"
  />
</svg>
