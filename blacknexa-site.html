on\" sc-camel-on-click=\"{{ goTermsFromDisc }}\" style=\"background:var(--bn-acc,#0A7CFF);color:var(--bn-accInk,#FFFFFF);border:0;border-radius:3px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"filter:brightness(1.08)\">Read the full Terms of Service<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeDisc }}\" style=\"background:transparent;color:var(--bn-ink2,#55606E);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:12px 18px;font-size:14px;cursor:pointer\" style-hover=\"border-color:var(--bn-acc,#0A7CFF);color:var(--bn-acc,#0A7CFF)\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;blue&quot;,&quot;indigo&quot;,&quot;emerald&quot;,&quot;mono&quot;,&quot;gold&quot;],&quot;default&quot;:&quot;blue&quot;,&quot;tsType&quot;:&quot;'blue'|'indigo'|'emerald'|'mono'|'gold'&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showThemeSwitcher&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;forceServerError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Form states&quot;}}\">\nclass Component extends DCLogic {\n  accents = {\n    blue:    { name:\"Signal blue\",   light:{ acc:\"#0A7CFF\", accInk:\"#FFFFFF\", accSoft:\"rgba(10,124,255,0.10)\", bg2:\"#F1F5FA\", bg3:\"#EEF2F7\" }, dark:{ acc:\"#3D97FF\", accInk:\"#0A0E14\", accSoft:\"rgba(61,151,255,0.16)\" } },\n    mono:    { name:\"Black & white\", light:{ acc:\"#000000\", accInk:\"#FFFFFF\", accSoft:\"rgba(0,0,0,0.08)\",      bg2:\"#F4F4F4\", bg3:\"#EFEFEF\", line:\"#D4D4D4\", ink:\"#000000\", ink2:\"#4A4A4A\", ink3:\"#6E6E6E\", hero:\"#000000\", heroInk2:\"#B0B0B0\" }, dark:{ acc:\"#FFFFFF\", accInk:\"#0A0E14\", accSoft:\"rgba(255,255,255,0.14)\" } },\n    indigo:  { name:\"Indigo\",        light:{ acc:\"#4F46E5\", accInk:\"#FFFFFF\", accSoft:\"rgba(79,70,229,0.10)\",  bg2:\"#F3F3FB\", bg3:\"#EEEDFD\" }, dark:{ acc:\"#8A83F5\", accInk:\"#0A0E14\", accSoft:\"rgba(138,131,245,0.16)\" } },\n    emerald: { name:\"Emerald\",       light:{ acc:\"#0E8A5F\", accInk:\"#FFFFFF\", accSoft:\"rgba(14,138,95,0.10)\",  bg2:\"#F0F7F4\", bg3:\"#E6F4EE\" }, dark:{ acc:\"#4FBF8B\", accInk:\"#0A0E14\", accSoft:\"rgba(79,191,139,0.16)\" } },\n    gold:    { name:\"Warm gold\",     light:{ acc:\"#B78A00\", accInk:\"#FFFFFF\", accSoft:\"rgba(183,138,0,0.10)\",  bg2:\"#F7F4EC\", bg3:\"#F2EEE2\" }, dark:{ acc:\"#C9A227\", accInk:\"#17130F\", accSoft:\"rgba(201,162,39,0.16)\", bg:\"#17130F\", bg2:\"#1B1611\", bg3:\"#241E19\", line:\"#4A423A\", ink:\"#F5EFE6\", ink2:\"#A79E92\", ink3:\"#8C8377\", hero:\"#0C0A08\", heroInk:\"#F5EFE6\", heroInk2:\"#C6BDB0\" } }\n  };\n\n  surfaces = {\n    light: { bg:\"#FFFFFF\", bg2:\"#F1F5FA\", bg3:\"#EEF2F7\", line:\"#D5DCE4\", ink:\"#0E1116\", ink2:\"#55606E\", ink3:\"#7A8593\", hero:\"#0E1116\", heroInk:\"#FFFFFF\", heroInk2:\"#B7C2CF\" },\n    dark:  { bg:\"#0F1318\", bg2:\"#131820\", bg3:\"#1C242F\", line:\"#3A4653\", ink:\"#EDF2F8\", ink2:\"#98A5B4\", ink3:\"#7D8A99\", hero:\"#080B0E\", heroInk:\"#EDF2F8\", heroInk2:\"#B7C2CF\" }\n  };\n\n  pickAccent(k) {\n    this.setState({ theme: k });\n    try { localStorage.setItem(\"bn-accent\", k); } catch (e) {}\n  }\n\n  pickMode(m) {\n    const mode = m === \"dark\" ? \"dark\" : \"light\";\n    this.setState({ mode: mode });\n    try { localStorage.setItem(\"bn-mode\", mode); } catch (e) {}\n  }\n\n  palette(accentKey, mode) {\n    const m = mode === \"dark\" ? \"dark\" : \"light\";\n    const acc = this.accents[accentKey] || this.accents.blue;\n    const p = Object.assign({}, this.surfaces[m], acc[m] || {});\n    // Accent readability on the deep hero surface: a black accent would vanish there.\n    const dark = /^#0|^#1|^#2|^#000/.test(String(p.acc).toUpperCase()) && accentKey === \"mono\";\n    p.heroAcc = dark ? \"#FFFFFF\" : p.acc;\n    p.heroAccInk = dark ? \"#000000\" : p.accInk;\n    p.heroSoft = dark ? \"rgba(255,255,255,0.14)\" : p.accSoft;\n    // Mode-adaptive \"feature\" surface: follows Light/Dark instead of always deep.\n    if (m === \"dark\") {\n      p.aHero = p.hero; p.aHeroInk = p.heroInk; p.aHeroInk2 = p.heroInk2;\n      p.aHeroAcc = p.heroAcc; p.aHeroAccInk = p.heroAccInk; p.aHeroSoft = p.heroSoft;\n      p.aScrim = \"8 11 14\"; p.aOnHero = \"255 255 255\"; p.ok = \"#4FBF8B\"; p.err = \"#F0736B\";\n    } else {\n      p.aHero = p.bg2; p.aHeroInk = p.ink; p.aHeroInk2 = p.ink2;\n      p.aHeroAcc = p.acc; p.aHeroAccInk = p.accInk; p.aHeroSoft = p.accSoft;\n      p.aScrim = \"255 255 255\"; p.aOnHero = \"14 17 22\"; p.ok = \"#1A8F4C\"; p.err = \"#D23B33\";\n    }\n    return p;\n  }\n\n  state = {\n    theme: null, mode: \"light\", page: \"home\", scrolled: false, menu: false, vw: 1440,\n    news: \"live\", shared: false, activeToc: \"\", discOpen: false,\n    faqOpen: 0, promoPlaying: false, refCopied: false,\n    clips: { d1: true, d2: true, d3: true },\n    forms: {\n      hero: { email: \"\", phone: \"\", showPhone: false, err: \"\", bad: false, status: \"idle\" },\n      cta:  { email: \"\", phone: \"\", showPhone: false, err: \"\", bad: false, status: \"idle\" }\n    },\n    contact: { name: \"\", email: \"\", subject: \"general\", msg: \"\", errs: {}, status: \"idle\" }\n  };\n\n  get theme() { const k = this.state.theme || this.props.theme || \"blue\"; return this.accents[k] ? k : \"blue\"; }\n  get mode() { return this.state.mode === \"dark\" ? \"dark\" : \"light\"; }\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const s = window.scrollY > 24;\n      if (s !== this.state.scrolled) this.setState({ scrolled: s });\n      this.trackToc();\n    };\n    this._onResize = () => this.setState({ vw: window.innerWidth });\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n    window.addEventListener(\"resize\", this._onResize);\n    let saved = {};\n    try {\n      const acc = localStorage.getItem(\"bn-accent\");\n      const mode = localStorage.getItem(\"bn-mode\");\n      if (acc && this.accents[acc]) saved.theme = acc;\n      if (mode === \"dark\" || mode === \"light\") saved.mode = mode;\n    } catch (e) {}\n    this.setState(Object.assign({ vw: window.innerWidth }, saved));\n    requestAnimationFrame(() => this.initReveal());\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.props && prev.props.theme !== this.props.theme && this.props.theme) this.setState({ theme: this.props.theme });\n    requestAnimationFrame(() => this.initReveal());\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this._onScroll);\n    window.removeEventListener(\"resize\", this._onResize);\n    if (this._onKey) document.removeEventListener(\"keydown\", this._onKey, true);\n    document.body.style.overflow = \"\";\n    if (this._io) this._io.disconnect();\n  }\n\n  openDisclaimers(e) {\n    if (e) e.preventDefault();\n    this._discTrigger = (e && e.currentTarget) || document.activeElement;\n    if (!this._onKey) {\n      this._onKey = (ev) => {\n        if (!this.state.discOpen) return;\n        if (ev.key === \"Escape\") { ev.preventDefault(); this.closeDisclaimers(); return; }\n        if (ev.key !== \"Tab\" || !this._discPanel) return;\n        const f = this._discPanel.querySelectorAll(\"button, a[href], [tabindex]:not([tabindex='-1'])\");\n        if (!f.length) return;\n        const first = f[0], last = f[f.length - 1];\n        if (ev.shiftKey && (document.activeElement === first || document.activeElement === this._discPanel)) { ev.preventDefault(); last.focus(); }\n        else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }\n      };\n    }\n    document.addEventListener(\"keydown\", this._onKey, true);\n    document.body.style.overflow = \"hidden\";\n    this.setState({ discOpen: true, menu: false });\n  }\n\n  closeDisclaimers() {\n    if (this._onKey) document.removeEventListener(\"keydown\", this._onKey, true);\n    document.body.style.overflow = \"\";\n    const trigger = this._discTrigger;\n    this.setState({ discOpen: false }, () => {\n      if (trigger && typeof trigger.focus === \"function\") trigger.focus();\n    });\n  }\n\n  setDiscPanel = (el) => {\n    this._discPanel = el;\n    if (el) requestAnimationFrame(() => { try { el.focus(); } catch (err) {} });\n  };\n\n  initReveal() {\n    if (typeof window === \"undefined\" || !window.IntersectionObserver) return;\n    if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    if (!this._io) {\n      this._io = new IntersectionObserver((ents) => {\n        ents.forEach((en) => {\n          if (!en.isIntersecting) return;\n          const d = +(en.target.dataset.revealDelay || 0);\n          en.target.style.transition = \"opacity .75s ease \" + d + \"ms, transform .75s cubic-bezier(.2,.7,.2,1) \" + d + \"ms\";\n          en.target.style.opacity = \"1\";\n          en.target.style.transform = \"none\";\n          this._io.unobserve(en.target);\n        });\n      }, { threshold: 0.1, rootMargin: \"0px 0px -6% 0px\" });\n    }\n    document.querySelectorAll(\"[data-reveal]\").forEach((el) => {\n      if (el.__bnrv) return;\n      el.__bnrv = 1;\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.94) { el.style.opacity = \"1\"; return; }\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(22px)\";\n      this._io.observe(el);\n    });\n  }\n\n  trackToc() {\n    if (this.state.page !== \"privacy\" && this.state.page !== \"terms\") return;\n    const secs = this.legalData()[this.state.page].sections;\n    let active = \"\";\n    secs.forEach((s) => {\n      const el = document.getElementById(s.id);\n      if (el && el.getBoundingClientRect().top < 180) active = s.id;\n    });\n    if (active !== this.state.activeToc) this.setState({ activeToc: active });\n  }\n\n  nav(page, e) {\n    if (e) e.preventDefault();\n    this.setState({ page, menu: false, activeToc: \"\" });\n    requestAnimationFrame(() => window.scrollTo(0, 0));\n  }\n\n  jump(id, e) {\n    if (e) e.preventDefault();\n    const go = () => {\n      const el = document.getElementById(id);\n      if (!el) return;\n      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 86, behavior: \"smooth\" });\n    };\n    if (this.state.page !== \"home\") { this.setState({ page: \"home\", menu: false }); setTimeout(go, 90); }\n    else { this.setState({ menu: false }); requestAnimationFrame(go); }\n  }\n\n  jumpLegal(id, e) {\n    if (e) e.preventDefault();\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 108, behavior: \"smooth\" });\n  }\n\n  setF(key, patch) {\n    this.setState((s) => ({ forms: Object.assign({}, s.forms, { [key]: Object.assign({}, s.forms[key], patch) }) }));\n  }\n\n  validEmail(v) { return /^[^\\s@]+@[^\\s@]+\\.[a-z]{2,}$/i.test((v || \"\").trim()); }\n\n  submitWaitlist(key, e) {\n    if (e) e.preventDefault();\n    const f = this.state.forms[key];\n    if (!f.email.trim()) { this.setF(key, { err: \"Enter an email address so we can reach you.\", bad: true }); return; }\n    if (!this.validEmail(f.email)) { this.setF(key, { err: \"That email address doesn't look right.\", bad: true }); return; }\n    this.setF(key, { err: \"\", bad: false, status: \"sending\" });\n    clearTimeout(this[\"_t\" + key]);\n    this[\"_t\" + key] = setTimeout(() => {\n      const fail = this.props.forceServerError || /@error\\./i.test(this.state.forms[key].email);\n      if (fail) this.setF(key, { status: \"idle\", bad: true, err: \"Something went wrong on our end — try again.\" });\n      else this.setF(key, { status: \"success\", err: \"\", bad: false });\n    }, 1150);\n  }\n\n  waitlistVals(key, pre) {\n    const f = this.state.forms[key];\n    const t = this.palette(this.theme, this.mode);\n    const out = {};\n    out[pre + \"Email\"] = f.email;\n    out[pre + \"Phone\"] = f.phone;\n    out[pre + \"ShowPhone\"] = f.showPhone;\n    out[pre + \"PhoneHidden\"] = !f.showPhone;\n    out[pre + \"Err\"] = f.err;\n    out[pre + \"HasErr\"] = f.bad;\n    out[pre + \"MsgColor\"] = f.bad ? t.err : (key === \"hero\" ? (this.mode === \"dark\" ? t.heroInk2 : t.ink2) : t.ink3);\n    out[pre + \"Border\"] = f.bad ? t.err : (key === \"hero\" ? (this.mode === \"dark\" ? \"rgba(255,255,255,0.2)\" : t.line) : t.line);\n    out[pre + \"Sending\"] = f.status === \"sending\";\n    out[pre + \"Success\"] = f.status === \"success\";\n    out[pre + \"Idle\"] = f.status !== \"success\";\n    out[pre + \"BtnLabel\"] = f.status === \"sending\" ? \"Securing…\" : (key === \"hero\" ? \"Secure Your Spot\" : \"Join the Global Movement\");\n    out[pre + \"SetEmail\"] = (e) => this.setF(key, { email: e.target.value, err: \"\", bad: false });\n    out[pre + \"SetPhone\"] = (e) => this.setF(key, { phone: e.target.value });\n    out[pre + \"Blur\"] = () => { if (f.email.trim() && !this.validEmail(f.email)) this.setF(key, { err: \"That email address doesn't look right.\", bad: true }); };\n    out[pre + \"TogglePhone\"] = () => this.setF(key, { showPhone: true });\n    out[pre + \"Submit\"] = (e) => this.submitWaitlist(key, e);\n    return out;\n  }\n\n  setC(patch) { this.setState((s) => ({ contact: Object.assign({}, s.contact, patch) })); }\n\n  contactErrs(c) {\n    const errs = {};\n    if (!c.name.trim()) errs.name = \"Tell us your name.\";\n    if (!c.email.trim()) errs.email = \"We need an email to reply to.\";\n    else if (!this.validEmail(c.email)) errs.email = \"That email address doesn't look right.\";\n    if (c.msg.trim().length < 12) errs.msg = \"A little more detail helps us route thi
