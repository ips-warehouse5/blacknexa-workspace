document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

mily:'Spectral',Georgia,serif;font-size:clamp(1.3rem,1.9vw,1.75rem);line-height:1.05;font-weight:600;color:var(--bn-ink,#0E1116)\">{{ item.value }}<\u002Fp>\n          <p style=\"margin:9px 0 0;font-size:13.5px;line-height:1.5;color:var(--bn-ink2,#55606E)\">{{ item.note }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Built on faith\" style=\"position:relative;background:var(--bn-hero,#0E1116);--bn-acc:var(--bn-heroAcc,#0A7CFF);--bn-accInk:var(--bn-heroAccInk,#FFFFFF);--bn-accSoft:var(--bn-heroSoft,rgba(10,124,255,0.10));padding:clamp(84px,10vw,136px) 28px;overflow:hidden;--bn-hero:var(--bn-aHero,#0E1116);--bn-heroInk:var(--bn-aHeroInk,#FFFFFF);--bn-heroInk2:var(--bn-aHeroInk2,#B7C2CF);--bn-heroAcc:var(--bn-aHeroAcc,#0A7CFF);--bn-heroAccInk:var(--bn-aHeroAccInk,#FFFFFF);--bn-heroSoft:var(--bn-aHeroSoft,rgba(10,124,255,0.10))\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(88% 120% at 50% -10%,var(--bn-accSoft,rgba(10,124,255,0.10)) 0%,rgba(0,0,0,0) 62%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1080px;margin:0 auto\" data-reveal=\"\">\n      <h2 style=\"margin:0;max-width:16ch;font-family:'Spectral',Georgia,serif;font-weight:700;font-size:clamp(2.1rem,5.4vw,4.1rem);line-height:1.02;letter-spacing:-0.02em;color:var(--bn-heroInk,#FFFFFF);text-wrap:balance\">BLACKNEXA™: Built on Faith. Driven by Truth. Unstoppable.<\u002Fh2>\n      <div style=\"margin-top:clamp(38px,4vw,58px);display:flex;flex-wrap:wrap;gap:clamp(26px,3.5vw,58px);align-items:flex-start\">\n        <p style=\"margin:0;flex:0 0 auto;font-family:'Spectral',Georgia,serif;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.1;color:var(--bn-acc,#0A7CFF)\">First, God.<\u002Fp>\n        <p style=\"margin:0;flex:1 1 460px;min-width:min(100%,300px);max-width:70ch;font-size:clamp(1rem,1.25vw,1.15rem);line-height:1.78;color:var(--bn-heroInk2,#B7C2CF);text-wrap:pretty\">In everything we do, God comes first. We honor Him, keep His commandments, and let His wisdom direct our steps. When we live out our faith openly and walk in His divine purpose, His blessings flow naturally-bringing true abundance, clarity, and peace without any sorrow attached. The truth speaks for itself, and people everywhere naturally recognize and gravitate toward the light.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(84px,11vw,148px) 28px\">\n    <div style=\"max-width:764px;margin:0 auto;text-align:center\" data-reveal=\"\">\n      <p style=\"margin:0 0 26px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">ABOUT BLACKNEXA<\u002Fp>\n      <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4.1vw,3.2rem);line-height:1.1;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">A digital sanctuary, a powerful shield, and a global megaphone.<\u002Fh2>\n      <p style=\"margin:34px 0 0;font-size:clamp(1rem,1.25vw,1.14rem);line-height:1.78;color:var(--bn-ink2,#55606E);text-align:left;text-wrap:pretty\">Welcome to BlackNexa™-a breakthrough, grassroots movement and trademark-pending mobile platform built specifically for the rising generation of Black and brown and underserved communities. This isn't just an app; it is a digital sanctuary, a powerful shield, and a global megaphone for those ready to make a real change, walk in goodness, and rise above the noise. Rooted deeply in our rich history of overcoming adversity through Godly principles, unshakeable faith, elite education, and right living, we are not defined by the color of our skin, but by the content of our character, our brilliant minds, and our spiritual strength.<\u002Fp>\n      <p style=\"margin:22px 0 0;font-size:clamp(1rem,1.25vw,1.14rem);line-height:1.78;color:var(--bn-ink2,#55606E);text-align:left;text-wrap:pretty\">BLACKNEXA™ is a revolutionary, God-centered ecosystem combining a fact-driven AI news engine with powerful community tools to combat systemic discrimination against Black, Brown, and underserved communities. Officially filed with the USPTO as a legally protected social media platform, our mobile app and website serve as a trusted shield, a clear voice, and a verified portal for global press and media engagement. Grounded in Godly principles, we protect our community through positive, actionable civil rights resources and a highly secure digital vault engineered to preserve vital personal assets. Encrypted security built directly into our application ensures absolute defense to protect digital personal data at all times<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"NEXA\" style=\"background:var(--bn-bg2,#F1F5FA);border-top:1px solid var(--bn-line,#D5DCE4);padding:clamp(76px,9vw,124px) 28px\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-start;gap:clamp(32px,5vw,76px)\" data-reveal=\"\">\n      <div style=\"flex:0 1 380px;min-width:min(100%,280px)\">\n        <p style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:700;font-size:clamp(3.4rem,8vw,6.6rem);line-height:0.86;letter-spacing:-0.03em;color:var(--bn-acc,#0A7CFF)\">NEXA<\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:12px;font-weight:600;letter-spacing:0.2em;color:var(--bn-ink3,#7A8593)\">= THE NEXT GENERATION<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 440px;min-width:min(100%,300px);max-width:64ch\">\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.6rem,2.9vw,2.3rem);line-height:1.14;letter-spacing:-0.012em;color:var(--bn-ink,#0E1116);text-wrap:balance\">NEXA: The Power of the Our Next Generation<\u002Fh2>\n        <p style=\"margin:22px 0 0;font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.78;color:var(--bn-ink2,#55606E);text-wrap:pretty\">NEXA stands for The Next Generation. We are paving the way and opening doors of real opportunity for Black and Brown and Underserved Communities across the globe. We are putting advanced technology directly back into the hands of the people-empowering our youth and our communities to let their voices be heard, stand up for their rights, and handle injustice in a peaceful, godly manner.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"mission\" style=\"background:var(--bn-bg,#FFFFFF);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,72px)\" data-reveal=\"\">\n      <div style=\"flex:0 1 240px;min-width:min(100%,200px)\"><p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">MISSION STATEMENT<\u002Fp><\u002Fdiv>\n      <div style=\"flex:1 1 520px;min-width:min(100%,300px);max-width:66ch\">\n        <p style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:500;font-size:clamp(1.4rem,2.6vw,2.15rem);line-height:1.34;letter-spacing:-0.01em;color:var(--bn-ink,#0E1116);text-wrap:pretty\">To equip Black, Brown, underserved and disenfranchised communities with God-centered technology that documents the truth, protects the evidence, and carries a verified voice to the people with the authority to act on it.<\u002Fp>\n        <div style=\"margin-top:clamp(30px,3.4vw,44px);display:flex;flex-wrap:wrap;gap:14px\">\n          <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:11px;border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:14px 20px;background:var(--bn-bg2,#F1F5FA)\">\n              <span style=\"color:var(--bn-acc,#0A7CFF);display:flex\">{{ v.icon }}<\u002Fspan>\n              <span style=\"font-size:14px;letter-spacing:0.03em;color:var(--bn-ink,#0E1116)\">{{ v.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"services\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:660px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">CORE SERVICES / KEY FEATURES<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">Everything the platform does, in one place.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(44px,5vw,68px);display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:1px;background:var(--bn-line,#D5DCE4);border:1px solid var(--bn-line,#D5DCE4);border-radius:4px;overflow:hidden\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"background:var(--bn-bg,#FFFFFF);padding:32px 28px 36px;display:flex;flex-direction:column\" data-reveal=\"\">\n            <span style=\"color:var(--bn-acc,#0A7CFF);display:flex\">{{ s.icon }}<\u002Fspan>\n            <h3 style=\"margin:20px 0 0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.28rem;line-height:1.22;color:var(--bn-ink,#0E1116)\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin:11px 0 0;font-size:14.5px;line-height:1.66;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ s.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Platform benefits\" style=\"background:var(--bn-bg,#FFFFFF);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:660px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">PLATFORM BENEFITS<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">What changes when you carry it.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(40px,4.6vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(26px,3vw,44px)\">\n        <sc-for list=\"{{ benefits }}\" as=\"b\" hint-placeholder-count=\"6\">\n          <div style=\"padding-top:22px;border-top:1px solid var(--bn-line,#D5DCE4)\" data-reveal=\"\">\n            <h3 style=\"margin:0;display:flex;gap:12px;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.22rem;line-height:1.24;color:var(--bn-ink,#0E1116)\"><span style=\"color:var(--bn-acc,#0A7CFF);font-size:0.78em;padding-top:0.2em;font-variant-numeric:tabular-nums\">{{ b.n }}<\u002Fspan>{{ b.title }}<\u002Fh3>\n            <p style=\"margin:12px 0 0;font-size:14.5px;line-height:1.68;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ b.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Global mission\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1000px;margin:0 auto\" data-reveal=\"\">\n      <p style=\"margin:0 0 20px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">BLACKNEXA GLOBAL MISSION<\u002Fp>\n      <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.1;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116)\">Automated Global Research &amp; Dignity Mission<\u002Fh2>\n      <blockquote style=\"margin:clamp(30px,3.4vw,44px) 0 0;padding-left:clamp(20px,2.4vw,34px);border-left:2px solid var(--bn-acc,#0A7CFF)\">\n        <p style=\"margin:0;font-family:'Spectral',Georgia,serif;font-size:clamp(1.16rem,1.9vw,1.6rem);line-height:1.5;color:var(--bn-ink,#0E1116);text-wrap:pretty\">“BlackNexa™ employs automated AI geographic research to connect users anywhere in the world with the exact local, state, national, and international oversight authorities qualified to address their specific incidents-whether regarding housing discrimination, workplace bias, civil rights violations, or law enforcement misconduct. Grounded in the belief that all individuals are created equal under God and deserve to be treated with dignity, honor, and respect, BlackNexa™ provides the technical tools to ensure community voices are heard globally.”<\u002Fp>\n      <\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"How a report travels\" style=\"background:var(--bn-bg,#FFFFFF);border-top:1px solid var(--bn-line,#D5DCE4);padding:clamp(84px,10vw,140px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:720px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">CORE INCIDENT REPORTING, GLOBAL DISPATCH &amp; RESOURCE DIRECTORY<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116)\">From the moment it happens to the desk that answers.<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:clamp(48px,5.5vw,76px);display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:1px;background:var(--bn-line,#D5DCE4);border:1px solid var(--bn-line,#D5DCE4);border-radius:4px;overflow:hidden\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--bn-bg2,#F1F5FA);padding:34px 30px 38px;display:flex;flex-direction:column\" data-reveal=\"\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"color:var(--bn-acc,#0A7CFF);display:flex\">{{ s.icon }}<\u002Fspan>\n              <span style=\"font-family:'Spectral',Georgia,serif;font-size:15px;letter-spacing:0.06em;color:var(--bn-ink3,#7A8593)\">{{ s.num }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin:22px 0 0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.32rem;line-height:1.2;color:var(--bn-ink,#0E1116)\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin:12px 0 0;font-size:14.5px;line-height:1.68;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ s.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:clamp(52px,6vw,86px)\" data-reveal=\"\">\n        <h3 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.4rem,2.2vw,1.9rem);color:var(--bn-ink,#0E1116)\">Example Workflow in Action<\u002Fh3>\n        <div style=\"margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px\">\n          <sc-for list=\"{{ workflows }}\" as=\"w\" hint-placeholder-count=\"2\">\n            <div style=\"border:1px solid var(--bn-line,#D5DCE4);border-radius:5px;background:var(--bn-bg2,#F1F5FA);padding:30px\">\n              <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.16em;color:var(--bn-acc,#0A7CFF)\">{{ w.label }}<\u002Fp>\n              <p style=\"margin:16px 0 0;font-size:15px;line-height:1.72;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ w.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"features\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(84px,10vw,140px) 28px clamp(60px,7vw,92px)\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:700px;margin-bottom:clamp(56px,6vw,84px)\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">INSIDE BLACKNEXA™<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116)\">Your All-in-One Powerhouse<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:clamp(64px,8vw,116px)\">\n        <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-wrap:wrap;flex-direction:{{ b.dir }};align-items:center;gap:clamp(34px,4.5vw,72px)\" data-reveal=\"\">\n            <div style=\"flex:1 1 440px;min-width:min(100%,300px)\">\n              <div style=\"position:relative;aspect-ratio:4 / 3;border:1px solid var(--bn-line,#D5DCE4);border-radius:6px;overflow:hidden;background:var(--bn-bg3,#EEF2F7)\">\n                <image-slot id=\"{{ b.slot }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ b.slotHint }}\"><\u002Fimage-slot>\n                <div style=\"position:absolute;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,17,22,0) 0%,rgba(14,17,22,0.72) 100%);height:44%\"><\u002Fdiv>\n                <div style=\"position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:10px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ b.toggle }}\" aria-label=\"{{ b.playLabel }}\" style=\"width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.4);background:rgba(14,17,22,0.6);color:#FFFFFF;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)\" style-hover=\"border-color:var(--bn-acc,#0A7CFF);color:var(--bn-acc,#0A7CFF)\">{{ b.playGlyph }}<\u002Fbutton>\n                  <span style=\"font-size:11px;letter-spacing:0.14em;color:#EEF2F7\">{{ b.clipState }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"position:absolute;right:14px;top:14px;font-size:10px;font-weight:600;letter-spacing:0.14em;color:#EEF2F7;background:rgba(14,17,22,0.62);border:1px solid rgba(255,255,255,0.2);border-radius:2px;padding:5px 8px\">POSTER FRAME<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:12px 0 0;font-size:12.5px;line-height:1.55;color:var(--bn-ink3,#7A8593)\">{{ b.caption }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 380px;min-width:min(100%,290px)\">\n              <p style=\"margin:0 0 18px;font-family:'Spectral',Georgia,serif;font-size:15px;letter-spacing:0.06em;color:var(--bn-acc,#0A7CFF)\">{{ b.num }}<\u002Fp>\n              <h3 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.55rem,2.7vw,2.2rem);line-height:1.14;letter-spacing:-0.012em;color:var(--bn-ink,#0E1116);text-wrap:balance\">{{ b.title }}<\u002Fh3>\n              <p style=\"margin:12px 0 0;font-size:14px;font-style:italic;line-height:1.5;color:var(--bn-acc,#0A7CFF)\">{{ b.sub }}<\u002Fp>\n              <sc-for list=\"{{ b.body }}\" as=\"para\" hint-placeholder-count=\"2\">\n                <p style=\"margin:20px 0 0;font-size:clamp(0.98rem,1.15vw,1.08rem);line-height:1.74;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ para }}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"news\" style=\"background:var(--bn-bg,#FFFFFF);padding:clamp(84px,10vw,140px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:660px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">PRODUCT HIGHLIGHTS · THE NEWS ENGINE<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116)\">Real news. Zero mainstream noise.<\u002Fh2>\n        <p style=\"margin:26px 0 0;font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.7;color:var(--bn-ink2,#55606E);text-wrap:pretty\">Mainstream media decides what matters. BlackNexa runs a strict, source-verified news engine on the subjects our communities actually need in order to thrive.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:clamp(44px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:1px;background:var(--bn-line,#D5DCE4);border:1px solid var(--bn-line,#D5DCE4);border-radius:4px;overflow:hidden\">\n        <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--bn-bg2,#F1F5FA);padding:34px 30px 38px\" data-reveal=\"\">\n            <span style=\"color:var(--bn-acc,#0A7CFF);display:flex\">{{ c.icon }}<\u002Fspan>\n            <h3 style=\"margin:20px 0 0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.32rem;line-height:1.22;color:var(--bn-ink,#0E1116)\">{{ c.title }}<\u002Fh3>\n            <p style=\"margin:11px 0 0;font-size:14.5px;line-height:1.62;color:var(--bn-ink2,#55606E)\">{{ c.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:clamp(56px,6vw,86px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;padding-bottom:20px;border-bottom:1px solid var(--bn-line,#D5DCE4)\">\n        <div>\n          <h3 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.4rem,2.2vw,1.9rem);color:var(--bn-ink,#0E1116)\">Latest from BlackNexa News<\u002Fh3>\n          <p style=\"margin:9px 0 0;font-size:12.5px;line-height:1.5;color:var(--bn-ink3,#7A8593)\">Pulled live from the public news API. Layout shown with placeholder cards — nothing is published yet.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"font-size:10.5px;letter-spacing:0.14em;color:var(--bn-ink3,#7A8593)\">PREVIEW STATE<\u002Fspan>\n          <sc-for list=\"{{ newsStates }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ s.pick }}\" aria-pressed=\"{{ s.on }}\" style=\"background:{{ s.bg }};color:{{ s.fg }};border:1px solid {{ s.border }};border-radius:2px;padding:7px 12px;font-size:12px;cursor:pointer\">{{ s.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ newsLive }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px\">\n          <sc-for list=\"{{ articles }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <article style=\"border:1px solid var(--bn-line,#D5DCE4);border-radius:5px;overflow:hidden;background:var(--bn-bg2,#F1F5FA);transition:transform .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-4px);border-color:var(--bn-acc,#0A7CFF)\" data-reveal=\"\">\n              <div style=\"position:relative;aspect-ratio:16 / 10;background:var(--bn-bg3,#EEF2F7)\">\n                <image-slot id=\"{{ a.slot }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ a.slotHint }}\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <div style=\"padding:22px 22px 26px\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font-size:10px;font-weight:600;letter-spacing:0.14em;color:var(--bn-acc,#0A7CFF);border:1px solid var(--bn-acc,#0A7CFF);border-radius:2px;padding:4px 8px\">{{ a.cat }}<\u002Fspan>\n                  <span style=\"font-size:10px;letter-spacing:0.1em;color:var(--bn-ink3,#7A8593);border:1px solid var(--bn-line,#D5DCE4);border-radius:2px;padding:4px 8px\">{{ a.sources }}<\u002Fspan>\n                <\u002Fdiv>\n                <h4 style=\"margin:16px 0 0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.2rem;line-height:1.26;color:var(--bn-ink,#0E1116)\">{{ a.headline }}<\u002Fh4>\n                <p style=\"margin:14px 0 0;font-size:12px;letter-spacing:0.04em;color:var(--bn-ink3,#7A8593)\">{{ a.meta }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ newsLoading }}\" hint-placeholder-val=\"{{ false }}\">\n        <div aria-busy=\"true\" style=\"margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px\">\n          <sc-for list=\"{{ skeletons }}\" as=\"k\" hint-placeholder-count=\"3\">\n            <div style=\"border:1px solid var(--bn-line,#D5DCE4);border-radius:5px;overflow:hidden;background:var(--bn-bg2,#F1F5FA)\">\n              <div style=\"aspect-ratio:16 / 10;background:linear-gradient(90deg,var(--bn-bg3,#EEF2F7) 0%,var(--bn-bg2,#F1F5FA) 42%,var(--bn-bg3,#EEF2F7) 84%);background-size:420px 100%;animation:bn-shim 1.3s linear infinite\"><\u002Fdiv>\n              <div style=\"padding:22px\">\n                <div style=\"width:88px;height:20px;border-radius:2px;background:var(--bn-bg3,#EEF2F7)\"><\u002Fdiv>\n                <div style=\"margin-top:16px;height:15px;border-radius:2px;background:var(--bn-bg3,#EEF2F7)\"><\u002Fdiv>\n                <div style=\"margin-top:9px;height:15px;width:72%;border-radius:2px;background:var(--bn-bg3,#EEF2F7)\"><\u002Fdiv>\n                <div style=\"margin-top:18px;height:11px;width:44%;border-radius:2px;background:var(--bn-bg3,#EEF2F7)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ newsEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:34px;border:1px dashed var(--bn-line,#D5DCE4);border-radius:5px;padding:clamp(44px,6vw,72px) 30px;text-align:center\">\n          <p style=\"margin:0;font-family:'Spectral',Georgia,serif;font-size:1.5rem;color:var(--bn-ink,#0E1116)\">The newsroom opens with the app.<\u002Fp>\n          <p style=\"margin:12px 0 0;font-size:14.5px;line-height:1.6;color:var(--bn-ink2,#55606E)\">No stories are published yet. Join the waitlist and the first briefing lands in your inbox.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ goWaitlist }}\" style=\"margin-top:24px;background:transparent;color:var(--bn-ink,#0E1116);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:12px 20px;font-size:14px;cursor:pointer\" style-hover=\"border-color:var(--bn-acc,#0A7CFF);color:var(--bn-acc,#0A7CFF)\">Join the waitlist<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Why choose BlackNexa\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1080px;margin:0 auto\">\n      <div style=\"max-width:660px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">WHY CHOOSE BLACKNEXA<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">Five things no other platform puts together.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(40px,4.6vw,62px);display:flex;flex-direction:column\">\n        <sc-for list=\"{{ whyChoose }}\" as=\"w\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,48px);padding:clamp(24px,2.6vw,32px) 0;border-top:1px solid var(--bn-line,#D5DCE4)\" data-reveal=\"\">\n            <p style=\"margin:0;flex:0 0 auto;width:56px;font-family:'Spectral',Georgia,serif;font-weight:700;font-size:1.5rem;line-height:1;color:var(--bn-acc,#0A7CFF);font-variant-numeric:tabular-nums\">{{ w.n }}<\u002Fp>\n            <h3 style=\"margin:0;flex:1 1 260px;min-width:min(100%,240px);font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.2rem,1.9vw,1.5rem);line-height:1.2;color:var(--bn-ink,#0E1116);text-wrap:balance\">{{ w.title }}<\u002Fh3>\n            <p style=\"margin:0;flex:1 1 400px;min-width:min(100%,280px);max-width:58ch;font-size:15px;line-height:1.72;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ w.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Brand protection and security\" style=\"background:var(--bn-bg,#FFFFFF);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:660px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">BRAND PROTECTION &amp; SECURITY<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">A protected platform, and protected people.<\u002Fh2>\n        <p style=\"margin:24px 0 0;font-size:clamp(1rem,1.2vw,1.1rem);line-height:1.72;color:var(--bn-ink2,#55606E);text-wrap:pretty\">The BlackNexa™ name and our custom technology are legally protected, so the platform our community depends on stays ours. The same seriousness governs how your data is held.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(40px,4.6vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:clamp(24px,3vw,40px)\">\n        <sc-for list=\"{{ security }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"padding-top:22px;border-top:1px solid var(--bn-line,#D5DCE4)\" data-reveal=\"\">\n            <span style=\"color:var(--bn-acc,#0A7CFF);display:flex\">{{ s.icon }}<\u002Fspan>\n            <h3 style=\"margin:18px 0 0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.2rem;line-height:1.22;color:var(--bn-ink,#0E1116)\">{{ s.title }}<\u002Fh3>\n            <p style=\"margin:11px 0 0;font-size:14.5px;line-height:1.66;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ s.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Community impact\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:680px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">COMMUNITY IMPACT<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">One record is a story. Thousands are evidence.<\u002Fh2>\n        <p style=\"margin:26px 0 0;font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.72;color:var(--bn-ink2,#55606E);text-wrap:pretty\">A single incident can be dismissed as an isolated case. When a community documents together, on the record and in one place, a pattern becomes impossible to wave away.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(40px,4.6vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:clamp(24px,3vw,40px)\">\n        <sc-for list=\"{{ impact }}\" as=\"i\" hint-placeholder-count=\"3\">\n          <div data-reveal=\"\">\n            <span style=\"color:var(--bn-acc,#0A7CFF);display:flex\">{{ i.icon }}<\u002Fspan>\n            <h3 style=\"margin:18px 0 0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.28rem;line-height:1.22;color:var(--bn-ink,#0E1116)\">{{ i.title }}<\u002Fh3>\n            <p style=\"margin:11px 0 0;font-size:14.5px;line-height:1.68;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ i.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(44px,5vw,68px);border:1px solid var(--bn-line,#D5DCE4);border-radius:5px;background:var(--bn-bg,#FFFFFF);padding:clamp(26px,3vw,38px)\" data-reveal=\"\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(24px,3vw,40px)\">\n          <sc-for list=\"{{ impactStats }}\" as=\"k\" hint-placeholder-count=\"3\">\n            <div>\n              <p style=\"margin:0;font-family:'Spectral',Georgia,serif;font-size:clamp(2rem,3.4vw,2.9rem);line-height:1;color:var(--bn-ink3,#7A8593)\">{{ k.value }}<\u002Fp>\n              <p style=\"margin:12px 0 0;font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--bn-acc,#0A7CFF)\">{{ k.label }}<\u002Fp>\n              <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--bn-ink2,#55606E)\">{{ k.note }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:26px 0 0;padding-top:20px;border-top:1px solid var(--bn-line,#D5DCE4);font-size:13px;line-height:1.6;color:var(--bn-ink3,#7A8593)\">Live figures publish at launch. We will not show a number we cannot evidence.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Promotional video\" style=\"position:relative;background:var(--bn-hero,#0E1116);--bn-acc:var(--bn-heroAcc,#0A7CFF);--bn-accInk:var(--bn-heroAccInk,#FFFFFF);--bn-accSoft:var(--bn-heroSoft,rgba(10,124,255,0.10));padding:clamp(80px,10vw,132px) 28px;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 110% at 50% 0%,var(--bn-accSoft,rgba(10,124,255,0.10)) 0%,rgba(0,0,0,0) 64%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1080px;marg omoState }} · 1:30<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--bn-ink3,#7A8593)\">Drop the poster frame above; the final film replaces this frame when it is delivered.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"waitlist\" style=\"background:var(--bn-bg,#FFFFFF);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(32px,4.5vw,72px);align-items:flex-start\">\n      <div style=\"flex:1 1 380px;min-width:min(100%,300px);max-width:56ch\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">WAITLIST REGISTRATION<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">Secure your spot before launch.<\u002Fh2>\n        <p style=\"margin:24px 0 0;font-size:clamp(1rem,1.2vw,1.1rem);line-height:1.72;color:var(--bn-ink2,#55606E);text-wrap:pretty\">Waitlist members get the download alert the moment BlackNexa reaches the Apple App Store and Google Play, plus early access as features roll out to our global family.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 420px;min-width:min(100%,300px);max-width:620px\" data-reveal=\"\" data-reveal-delay=\"120\">\n        <div>\n        <sc-if value=\"{{ ctaSuccess }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"status\" style=\"border:1px solid var(--bn-acc,#0A7CFF);background:var(--bn-accSoft,rgba(10,124,255,0.10));border-radius:5px;padding:28px 30px;text-align:center\">\n            <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 30 30\" aria-hidden=\"true\" style=\"display:block;margin:0 auto\"><circle cx=\"15\" cy=\"15\" r=\"14\" stroke=\"var(--bn-acc,#0A7CFF)\" stroke-width=\"1.6\" fill=\"none\"><\u002Fcircle><path d=\"M8.6 15.4 13 19.6 21.6 10.6\" stroke=\"var(--bn-acc,#0A7CFF)\" stroke-width=\"2.1\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"margin:16px 0 0;font-family:'Spectral',Georgia,serif;font-size:28px;font-weight:600;color:var(--bn-ink,#0E1116)\">You're on the list.<\u002Fh3>\n            <p style=\"margin:12px 0 0;font-size:15px;line-height:1.6;color:var(--bn-ink2,#55606E)\">We'll email you the moment BlackNexa hits the App Store and Google Play.<\u002Fp>\n            <div style=\"margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center\">\n              <button type=\"button\" sc-camel-on-click=\"{{ sharePage }}\" style=\"background:transparent;color:var(--bn-ink,#0E1116);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:11px 18px;font-size:14px;cursor:pointer\" style-hover=\"border-color:var(--bn-acc,#0A7CFF)\">{{ shareLabel }}<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ goNews }}\" style=\"background:transparent;color:var(--bn-ink,#0E1116);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:11px 18px;font-size:14px;cursor:pointer\" style-hover=\"border-color:var(--bn-acc,#0A7CFF)\">Follow the news<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ ctaIdle }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ ctaSubmit }}\" sc-camel-no-validate=\"{{ true }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <div style=\"flex:1 1 300px;min-width:min(100%,260px)\">\n                <label for=\"bn-cta-email\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Email address<\u002Flabel>\n                <input id=\"bn-cta-email\" type=\"email\" name=\"email\" sc-camel-auto-complete=\"email\" aria-invalid=\"{{ ctaHasErr }}\" aria-describedby=\"bn-cta-msg\" placeholder=\"Enter your email for pre-launch app store alerts…\" value=\"{{ ctaEmail }}\" sc-camel-on-change=\"{{ ctaSetEmail }}\" sc-camel-on-blur=\"{{ ctaBlur }}\" style=\"width:100%;background:var(--bn-bg2,#F1F5FA);border:1px solid {{ ctaBorder }};border-radius:3px;padding:16px 17px;font-size:15px;color:var(--bn-ink,#0E1116)\" style-focus=\"border-color:var(--bn-acc,#0A7CFF)\">\n              <\u002Fdiv>\n              <button type=\"submit\" disabled=\"{{ ctaSending }}\" style=\"flex:0 0 auto;background:var(--bn-acc,#0A7CFF);color:var(--bn-accInk,#FFFFFF);border:0;border-radius:3px;padding:16px 26px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px\" style-hover=\"filter:brightness(1.08)\" style-active=\"transform:translateY(1px)\">\n                <sc-if value=\"{{ ctaSending }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span aria-hidden=\"true\" style=\"width:15px;height:15px;border:2px solid rgba(0,0,0,0.28);border-top-color:currentColor;border-radius:50%;animation:bn-spin .7s linear infinite;display:block\"><\u002Fspan>\n                <\u002Fsc-if>\n                {{ ctaBtnLabel }}\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ ctaShowPhone }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:10px\">\n                <label for=\"bn-cta-phone\" style=\"display:block;font-size:12px;letter-spacing:0.1em;color:var(--bn-ink2,#55606E);margin-bottom:7px\">PHONE (OPTIONAL)<\u002Flabel>\n                <input id=\"bn-cta-phone\" type=\"tel\" name=\"phone\" placeholder=\"(555) 010-0199\" value=\"{{ ctaPhone }}\" sc-camel-on-change=\"{{ ctaSetPhone }}\" style=\"width:100%;max-width:320px;background:var(--bn-bg2,#F1F5FA);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:14px 16px;font-size:15px;color:var(--bn-ink,#0E1116)\" style-focus=\"border-color:var(--bn-acc,#0A7CFF)\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ ctaPhoneHidden }}\" hint-placeholder-val=\"{{ true }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ctaTogglePhone }}\" style=\"margin-top:12px;background:none;border:0;padding:0;font-size:13.5px;color:var(--bn-ink2,#55606E);cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.28)\" style-hover=\"color:var(--bn-acc,#0A7CFF);border-color:var(--bn-acc,#0A7CFF)\">+ Add a phone number for text alerts<\u002Fbutton>\n            <\u002Fsc-if>\n            <p id=\"bn-cta-msg\" role=\"alert\" style=\"margin:14px 0 0;min-height:1px;font-size:13.5px;line-height:1.5;color:{{ ctaMsgColor }}\">{{ ctaErr }}<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.6;color:var(--bn-ink2,#55606E)\">Instant push and email alert the moment we drop on the Apple App Store and Google Play. Zero spam.<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:12.5px;line-height:1.6;color:var(--bn-ink3,#7A8593)\">By joining you agree to our <a href=\"#privacy\" sc-camel-on-click=\"{{ goPrivacy }}\">Privacy Policy<\u002Fa>.<\u002Fp>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Referral program\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:660px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">REFERRAL PROGRAM<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">Bring your people. Build the movement faster.<\u002Fh2>\n        <p style=\"margin:24px 0 0;font-size:clamp(1rem,1.2vw,1.1rem);line-height:1.72;color:var(--bn-ink2,#55606E);text-wrap:pretty\">A community millions strong is built one invitation at a time. Share your link, and every person who joins through it moves both of you up the early-access list.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(40px,4.6vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:1px;background:var(--bn-line,#D5DCE4);border:1px solid var(--bn-line,#D5DCE4);border-radius:4px;overflow:hidden\">\n        <sc-for list=\"{{ referralSteps }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--bn-bg,#FFFFFF);padding:32px 28px 36px\" data-reveal=\"\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"color:var(--bn-acc,#0A7CFF);display:flex\">{{ r.icon }}<\u002Fspan>\n              <span style=\"font-family:'Spectral',Georgia,serif;font-size:15px;letter-spacing:0.06em;color:var(--bn-ink3,#7A8593)\">{{ r.num }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin:20px 0 0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:1.28rem;line-height:1.22;color:var(--bn-ink,#0E1116)\">{{ r.title }}<\u002Fh3>\n            <p style=\"margin:11px 0 0;font-size:14.5px;line-height:1.66;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ r.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(32px,3.6vw,48px);border:1px solid var(--bn-line,#D5DCE4);border-radius:5px;background:var(--bn-bg,#FFFFFF);padding:clamp(24px,3vw,34px);display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px\" data-reveal=\"\">\n        <div style=\"flex:1 1 320px;min-width:min(100%,280px)\">\n          <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--bn-ink3,#7A8593)\">YOUR REFERRAL LINK<\u002Fp>\n          <p style=\"margin:0;padding:15px 16px;border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;background:var(--bn-bg2,#F1F5FA);font-size:14.5px;color:var(--bn-ink,#0E1116);overflow-wrap:anywhere\">{{ referralLink }}<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ copyReferral }}\" style=\"flex:0 0 auto;background:var(--bn-acc,#0A7CFF);color:var(--bn-accInk,#FFFFFF);border:0;border-radius:3px;padding:16px 24px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:48px\" style-hover=\"filter:brightness(1.08)\" style-active=\"transform:translateY(1px)\">{{ copyLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--bn-ink3,#7A8593)\">Link shown is an example. Reward tiers are being finalised and will be confirmed before launch.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position:relative;background:var(--bn-hero,#0E1116);--bn-acc:var(--bn-heroAcc,#0A7CFF);--bn-accInk:var(--bn-heroAccInk,#FFFFFF);--bn-accSoft:var(--bn-heroSoft,rgba(10,124,255,0.10));padding:clamp(88px,11vw,152px) 28px;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:radial-gradient(72% 120% at 50% 0%,var(--bn-accSoft,rgba(10,124,255,0.10)) 0%,rgba(0,0,0,0) 68%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:860px;margin:0 auto;text-align:center\" data-reveal=\"\">\n      <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">THE FUTURE IS OURS<\u002Fp>\n      <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:700;font-size:clamp(2.1rem,5.2vw,4rem);line-height:1.02;letter-spacing:-0.02em;color:var(--bn-heroInk,#FFFFFF);text-wrap:balance\">This is our time. This is our tool.<\u002Fh2>\n      <p style=\"margin:28px auto 0;max-width:66ch;font-size:clamp(1rem,1.3vw,1.16rem);line-height:1.75;color:var(--bn-heroInk2,#B7C2CF);text-wrap:pretty\">BlackNexa is a movement of truth, power, and divine purpose. We are equipping the next generation of Black and Brown and Underserved and Disenfranchise Communities to be rooted in Gods Holy word, educated, business-savvy, and anchored in faith to level the playing field once and for all-ensuring that we prosper, walk according to His purpose, and let our voices be heard without ever being suppressed by discriminatory practices.<\u002Fp>\n      <p style=\"margin:22px auto 0;max-width:66ch;font-family:'Spectral',Georgia,serif;font-size:clamp(1.15rem,1.7vw,1.45rem);line-height:1.5;color:var(--bn-acc,#0A7CFF)\">Welcome to BlackNexa. To God be the Glory!<\u002Fp>\n\n      <div style=\"margin-top:40px;padding-top:32px;border-top:1px solid var(--bn-line,#D5DCE4)\">\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.18em;color:var(--bn-ink3,#7A8593)\">DOWNLOAD THE APP TODAY<\u002Fp>\n        <div style=\"margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px\">\n          <span style=\"display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:10px 18px;opacity:.55;font-size:13.5px;color:var(--bn-heroInk,#FFFFFF)\">\n            <svg width=\"16\" height=\"19\" sc-camel-view-box=\"0 0 17 20\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M13.9 10.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8C4.5 5.3 3 6.3 2.2 7.8c-1.6 2.8-.4 6.9 1.1 9.2.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7 1.4 0 1.8.7 3 .7 1.2 0 2-1.1 2.8-2.2.9-1.3 1.3-2.6 1.3-2.6-.1 0-2.4-.9-2.4-3.9ZM11.4 3.6c.6-.8 1-1.8.9-2.9-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2.1-.5 2.8-1.3Z\"><\u002Fpath><\u002Fsvg>App Store<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,0.16);border-radius:5px;padding:10px 18px;opacity:.55;font-size:13.5px;color:var(--bn-heroInk,#FFFFFF)\">\n            <svg width=\"16\" height=\"18\" sc-camel-view-box=\"0 0 17 19\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M1.4 1.1 10.6 9.5 1.4 17.9c-.3-.2-.5-.6-.5-1.1V2.2c0-.5.2-.9.5-1.1Z\"><\u002Fpath><path d=\"M12.2 7.9 14.9 9.5c.9.5.9 1.3 0 1.8l-2.7 1.6-2-2.4 2-2.6Z\"><\u002Fpath><path d=\"M2.4.7 11.3 6l-1.8 2.3L2.4.7Zm0 17.6L9.5 10.7l1.8 2.3-8.9 5.3Z\"><\u002Fpath><\u002Fsvg>Google Play<\u002Fspan>\n          <span style=\"align-self:center;font-size:11px;font-weight:600;letter-spacing:0.16em;color:var(--bn-acc,#0A7CFF);border:1px solid var(--bn-acc,#0A7CFF);border-radius:2px;padding:5px 10px\">COMING SOON<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ goWaitlist }}\" style=\"margin-top:34px;background:var(--bn-acc,#0A7CFF);color:var(--bn-accInk,#FFFFFF);border:0;border-radius:3px;padding:17px 30px;font-size:15px;font-weight:600;cursor:pointer\" style-hover=\"filter:brightness(1.08)\" style-active=\"transform:translateY(1px)\">Join the Global Movement<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"background:var(--bn-bg,#FFFFFF);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(30px,4vw,64px);align-items:flex-start\">\n      <div style=\"flex:0 1 300px;min-width:min(100%,260px)\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">FREQUENTLY ASKED QUESTIONS<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">Straight answers.<\u002Fh2>\n        <p style=\"margin:22px 0 0;font-size:15px;line-height:1.7;color:var(--bn-ink2,#55606E)\">Anything not covered here, write to us and a person will answer.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;min-width:min(100%,300px)\" data-reveal=\"\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"9\">\n          <div style=\"border-top:1px solid var(--bn-line,#D5DCE4)\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.toggle }}\" aria-expanded=\"{{ f.open }}\" style=\"width:100%;background:none;border:0;padding:22px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;text-align:left;cursor:pointer;min-height:48px;color:var(--bn-ink,#0E1116)\" style-hover=\"color:var(--bn-acc,#0A7CFF)\">\n              <span style=\"font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.08rem,1.6vw,1.28rem);line-height:1.3\">{{ f.q }}<\u002Fspan>\n              <span aria-hidden=\"true\" style=\"flex:0 0 auto;width:26px;height:26px;border:1px solid var(--bn-line,#D5DCE4);border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--bn-acc,#0A7CFF)\">{{ f.glyph }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;padding:0 0 24px;max-width:66ch;font-size:15px;line-height:1.76;color:var(--bn-ink2,#55606E);text-wrap:pretty\">{{ f.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"border-top:1px solid var(--bn-line,#D5DCE4)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"Contact and partnership\" style=\"background:var(--bn-bg2,#F1F5FA);padding:clamp(80px,10vw,132px) 28px\">\n    <div style=\"max-width:1280px;margin:0 auto\">\n      <div style=\"max-width:660px\" data-reveal=\"\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">CONTACT &amp; PARTNERSHIP<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(1.95rem,4vw,3.05rem);line-height:1.08;letter-spacing:-0.015em;color:var(--bn-ink,#0E1116);text-wrap:balance\">Work with us.<\u002Fh2>\n        <p style=\"margin:24px 0 0;font-size:clamp(1rem,1.2vw,1.1rem);line-height:1.72;color:var(--bn-ink2,#55606E);text-wrap:pretty\">Press, partnerships, advertising or legal — every message goes to a person, not a queue. We reply to most enquiries within two business days.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(40px,4.6vw,60px);display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:1px;background:var(--bn-line,#D5DCE4);border:1px solid var(--bn-line,#D5DCE4);border-radius:4px;overflow:hidden\">\n        <sc-for list=\"{{ contactLines }}\" as=\"l\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--bn-bg,#FFFFFF);padding:32px 28px 36px\" data-reveal=\"\">\n            <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:0.14em;color:var(--bn-ink3,#7A8593)\">{{ l.label }}<\u002Fp>\n            <p style=\"margin:14px 0 0;font-family:'Spectral',Georgia,serif;font-size:1.16rem;line-height:1.3\"><a href=\"{{ l.href }}\">{{ l.email }}<\u002Fa><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ goContact }}\" style=\"margin-top:clamp(28px,3vw,40px);background:transparent;color:var(--bn-ink,#0E1116);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:15px 24px;font-size:14.5px;cursor:pointer;min-height:48px\" style-hover=\"border-color:var(--bn-acc,#0A7CFF);color:var(--bn-acc,#0A7CFF)\">Open the full contact form<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"disclaimers\" style=\"background:var(--bn-bg,#FFFFFF);border-top:1px solid var(--bn-line,#D5DCE4);padding:clamp(72px,8vw,110px) 28px\">\n    <div style=\"max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,64px)\" data-reveal=\"\">\n      <div style=\"flex:0 1 260px;min-width:min(100%,220px)\">\n        <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">LEGAL DISCLAIMER<\u002Fp>\n        <svg width=\"34\" height=\"40\" sc-camel-view-box=\"0 0 48 56\" fill=\"none\" aria-hidden=\"true\"><path d=\"M24 2.6 44.2 9.4V28.2C44.2 41 35.4 50.2 24 53.8 12.6 50.2 3.8 41 3.8 28.2V9.4Z\" stroke=\"var(--bn-acc,#0A7CFF)\" stroke-width=\"2.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;min-width:min(100%,300px);max-width:74ch\">\n        <p style=\"margin:0;font-size:15.5px;line-height:1.76;color:var(--bn-ink2,#55606E);text-wrap:pretty\"><strong style=\"color:var(--bn-ink,#0E1116);font-weight:600\">Service Disclaimer:<\u002Fstrong> BlackNexa™ provides automated evidence vaulting, location resolution, and dynamic agency matching tools.<\u002Fp>\n        <p style=\"margin:18px 0 0;font-size:15.5px;line-height:1.76;color:var(--bn-ink2,#55606E);text-wrap:pretty\">BlackNexa™ is not a government agency, law firm, or legal referral service. Generating intake filings or transmitting verified incident packages to researched agencies does not guarantee that any agency will initiate an investigation, take enforcement action, or grant relief.<\u002Fp>\n        <div style=\"margin-top:26px;display:flex;flex-wrap:wrap;gap:12px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ openDisc }}\" style=\"background:var(--bn-acc,#0A7CFF);color:var(--bn-accInk,#FFFFFF);border:0;border-radius:3px;padding:14px 22px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:9px\" style-hover=\"filter:brightness(1.08)\">Read all disclaimers\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 18 18 6M9 6h9v9\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goTerms }}\" style=\"background:transparent;color:var(--bn-ink2,#55606E);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:14px 22px;font-size:14.5px;cursor:pointer;min-height:48px\" style-hover=\"border-color:var(--bn-acc,#0A7CFF);color:var(--bn-acc,#0A7CFF)\">Terms of Service<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Contact\" style=\"background:var(--bn-bg,#FFFFFF);padding:clamp(122px,13vw,176px) 28px clamp(80px,9vw,120px)\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <p style=\"margin:0 0 22px;font-size:11px;font-weight:600;letter-spacing:0.22em;color:var(--bn-acc,#0A7CFF)\">CONTACT<\u002Fp>\n    <h1 style=\"margin:0;max-width:20ch;font-family:'Spectral',Georgia,serif;font-weight:700;font-size:clamp(2.2rem,5vw,3.9rem);line-height:1.02;letter-spacing:-0.02em;color:var(--bn-ink,#0E1116)\">Reach the people building this.<\u002Fh1>\n    <p style=\"margin:24px 0 0;max-width:60ch;font-size:clamp(1rem,1.2vw,1.1rem);line-height:1.7;color:var(--bn-ink2,#55606E)\">Partnership, press, legal or a problem with the platform — send it here and it goes to a person, not a queue.<\u002Fp>\n\n    <div style=\"margin-top:clamp(48px,6vw,76px);display:flex;flex-wrap:wrap;gap:clamp(32px,4vw,60px)\">\n      <div style=\"flex:1 1 440px;min-width:min(100%,300px)\">\n        <sc-if value=\"{{ contactSuccess }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"status\" style=\"border:1px solid var(--bn-acc,#0A7CFF);background:var(--bn-accSoft,rgba(10,124,255,0.10));border-radius:5px;padding:34px\">\n            <h2 style=\"margin:0;font-family:'Spectral',Georgia,serif;font-size:28px;font-weight:600;color:var(--bn-ink,#0E1116)\">Message sent.<\u002Fh2>\n            <p style=\"margin:12px 0 0;font-size:15px;line-height:1.65;color:var(--bn-ink2,#55606E)\">We answer most enquiries within two business days. Partnership and press requests are prioritised.<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ contactReset }}\" style=\"margin-top:22px;background:transparent;color:var(--bn-ink,#0E1116);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:11px 18px;font-size:14px;cursor:pointer\" style-hover=\"border-color:var(--bn-acc,#0A7CFF)\">Send another<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ contactIdle }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ contactSubmit }}\" sc-camel-no-validate=\"{{ true }}\" style=\"display:flex;flex-direction:column;gap:22px\">\n            <div>\n              <label for=\"bn-c-name\" style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:0.14em;color:var(--bn-ink2,#55606E);margin-bottom:9px\">NAME<\u002Flabel>\n              <input id=\"bn-c-name\" type=\"text\" name=\"name\" sc-camel-auto-complete=\"name\" aria-invalid=\"{{ cNameBad }}\" placeholder=\"Your full name\" value=\"{{ contactName }}\" sc-camel-on-change=\"{{ contactSetName }}\" sc-camel-on-blur=\"{{ contactBlurName }}\" style=\"width:100%;background:var(--bn-bg2,#F1F5FA);border:1px solid {{ cNameBorder }};border-radius:3px;padding:15px 16px;font-size:15px;color:var(--bn-ink,#0E1116)\" style-focus=\"border-color:var(--bn-acc,#0A7CFF)\">\n              <p role=\"alert\" style=\"margin:7px 0 0;font-size:13px;color:var(--bn-err,#D23B33)\">{{ cNameErr }}<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <label for=\"bn-c-email\" style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:0.14em;color:var(--bn-ink2,#55606E);margin-bottom:9px\">EMAIL<\u002Flabel>\n              <input id=\"bn-c-email\" type=\"email\" name=\"email\" sc-camel-auto-complete=\"email\" aria-invalid=\"{{ cEmailBad }}\" placeholder=\"you@example.com\" value=\"{{ contactEmail }}\" sc-camel-on-change=\"{{ contactSetEmail }}\" sc-camel-on-blur=\"{{ contactBlurEmail }}\" style=\"width:100%;background:var(--bn-bg2,#F1F5FA);border:1px solid {{ cEmailBorder }};border-radius:3px;padding:15px 16px;font-size:15px;color:var(--bn-ink,#0E1116)\" style-focus=\"border-color:var(--bn-acc,#0A7CFF)\">\n              <p role=\"alert\" style=\"margin:7px 0 0;font-size:13px;color:var(--bn-err,#D23B33)\">{{ cEmailErr }}<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <label for=\"bn-c-subject\" style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:0.14em;color:var(--bn-ink2,#55606E);margin-bottom:9px\">SUBJECT<\u002Flabel>\n              <sc-raw-select id=\"bn-c-subject\" name=\"subject\" value=\"{{ contactSubject }}\" sc-camel-on-change=\"{{ contactSetSubject }}\" style=\"width:100%;background:var(--bn-bg2,#F1F5FA);border:1px solid var(--bn-line,#D5DCE4);border-radius:3px;padding:15px 16px;font-size:15px;color:var(--bn-ink,#0E1116);appearance:none\" style-focus=\"border-color:var(--bn-acc,#0A7CFF)\">\n                <option value=\"general\">General enquiry<\u002Foption>\n                <option value=\"partnership\">Partnership<\u002Foption>\n                <option value=\"press\">Press<\u002Foption>\n                <option value=\"problem\">Report a problem<\u002Foption>\n                <option value=\"legal\">Legal<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div>\n              <label for=\"bn-c-msg\" style=\"display:block;font-size:11.5px;font-weight:600;letter-spacing:0.14em;color:var(--bn-ink2,#55606E);margin-bottom:9px\">MESSAGE<\u002Flabel>\n              <textarea id=\"bn-c-msg\" name=\"message\" rows=\"6\" aria-invalid=\"{{ cMsgBad }}\" placeholder=\"Tell us what you need.\" value=\"{{ contactMsg }}\" sc-camel-on-change=\"{{ contactSetMsg }}\" sc-camel-on-blur=\"{{ contactBlurMsg }}\" style=\"width:100%;background:var(--bn-bg2,#F1F5FA);border:1px solid {{ cMsgBorder }};border-radius:3px;padding:15px 16px;font-size:15px;line-height:1.6;color:var(--bn-ink,#0E1116);resize:vertical\" style-focus=\"border-color:var(--bn-acc,#0A7CFF)\"><\u002Ftextarea>\n
